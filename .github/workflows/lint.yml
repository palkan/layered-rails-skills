name: Lint

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-skills:
    name: Skill best-practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history for --changed-only diff and for plugin.links-exist to resolve git refs.
          fetch-depth: 0

      - name: Lint SKILL.md and plugin files
        run: python3 scripts/lint-skills.py

  skill-freshness:
    name: Rendered skills freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails-hyperdrive/layered-rails
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: rails-hyperdrive/layered-rails

      - name: Verify SKILL.md matches its template
        run: bundle exec rake "hyperdrive:skills:check[../../layered-rails-skills.gemspec]"
