skills_dir: layered-rails/skills
skill_templates_dir: rails-hyperdrive/layered-rails/templates
agents_dir: layered-rails/agents
commands_dir: layered-rails/commands

gem: railties

commands:
  # Claude Code namespaces these as /layered-rails:<name> when the directory is
  # loaded as a plugin; installing into .claude/commands/ has no namespace, so
  # the prefix keeps the same identity and stays clear of the app's own commands.
  command_prefix: layered-rails

skills:
  layered-rails:
    conditional:
      references/gems/action-policy.md:
        gem: "action_policy"
      references/gems/view-component.md:
        gem: "view_component"
      references/gems/anyway-config.md:
        gem: "anyway_config"
      references/gems/active-delivery.md:
        gem: "active_delivery"
      references/gems/alba.md:
        gem: "alba"
      references/gems/workflow.md:
        gem: "workflow, workflow-activerecord"
      references/gems/rubanok.md:
        gem: "rubanok"
      references/gems/active-agent.md:
        gem: "activeagent"
      references/gems/active-job-performs.md:
        gem: "active_job-performs"
